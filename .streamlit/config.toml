[theme]
base = "dark"
primaryColor = "#00D4F5"
backgroundColor = "#14181B"
secondaryBackgroundColor = "#20272B"
textColor = "#EDF1F4"
borderColor = "#364149"
linkColor = "#00D4F5"
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#20272B"
dataframeBorderColor = "#364149"
chartCategoricalColors = ["#00D4F5", "#8BBBD6", "#69DF82"]

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
