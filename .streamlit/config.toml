[theme]
base = "dark"
primaryColor = "#4DA3FF"
backgroundColor = "#0B1424"
secondaryBackgroundColor = "#142238"
textColor = "#E8F0FA"
borderColor = "#2B405D"
linkColor = "#4DA3FF"
baseRadius = "6px"
buttonRadius = "6px"
baseFontSize = 14
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#1B2D46"
dataframeBorderColor = "#2B405D"
chartCategoricalColors = ["#00D4F5", "#8BBBD6", "#69DF82"]

[server]
headless = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
